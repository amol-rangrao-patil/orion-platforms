<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 44" fill="none">
  <defs>
    <filter id="orionDarkGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur2" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="orionDarkHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#00F5D4" stop-opacity="0.45" />
      <stop offset="80%" stop-color="#00D2B4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00D2B4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Glowing Neon Cyan Circle O (Vibrant in Dark Mode) -->
  <g id="letter-O1">
    <circle cx="24" cy="22" r="22" fill="url(#orionDarkHalo)" opacity="0.95" />
    <circle cx="24" cy="22" r="13" stroke="#00F5D4" stroke-width="5" opacity="0.6" filter="url(#orionDarkGlow)" />
    <circle cx="24" cy="22" r="13" stroke="#00F5D4" stroke-width="3.2" />
    <circle cx="24" cy="22" r="13" stroke="#FFFFFF" stroke-width="1.2" opacity="0.85" />
  </g>

  <!-- 2. R in Crisp White (#ffffff) -->
  <g id="letter-R" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 52 11 H 73 C 81 11 86 15 86 21 C 86 26.5 81 29.5 73.5 29.5 H 63" />
    <path d="M 64.5 28.5 C 69 28.5 73.5 29.5 76.5 33 L 83 34.5" />
  </g>

  <!-- 3. I in Crisp White (#ffffff) -->
  <line x1="112" y1="10" x2="112" y2="34" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" />

  <!-- 4. Second O in Crisp White (#ffffff) -->
  <circle cx="148" cy="22" r="13" stroke="#ffffff" stroke-width="3.2" />

  <!-- 5. N in Crisp White (#ffffff) -->
  <path d="M 180 34 V 10 L 199 34 V 10" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
