<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 44" fill="none">
  <defs>
    <style>
      .brand-letter { stroke: #0f172a; }
      @media (prefers-color-scheme: dark) {
        .brand-letter { stroke: #ffffff; }
      }
    </style>
    <filter id="orionAdaptiveGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="orionAdaptiveHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#00F5D4" stop-opacity="0.35" />
      <stop offset="90%" stop-color="#00D2B4" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#00D2B4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. FIRST 'O' with theme-adaptive styling -->
  <g id="letter-O1">
    <circle cx="24" cy="22" r="13" class="brand-letter" stroke-width="3.2" fill="none" />
    <circle cx="24" cy="22" r="4.5" fill="#0284c7" />
  </g>

  <!-- 2. FUTURISTIC 'R' -->
  <g id="letter-R" class="brand-letter" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 52 11 H 73 C 81 11 86 15 86 21 C 86 26.5 81 29.5 73.5 29.5 H 63" />
    <path d="M 64.5 28.5 C 69 28.5 73.5 29.5 76.5 33 L 83 34.5" />
  </g>

  <!-- 3. MINIMALIST 'I' -->
  <line x1="112" y1="10" x2="112" y2="34" class="brand-letter" stroke-width="3.2" stroke-linecap="round" />

  <!-- 4. GEOMETRIC SECOND 'O' -->
  <circle cx="148" cy="22" r="13" class="brand-letter" stroke-width="3.2" />

  <!-- 5. GEOMETRIC SANS 'N' -->
  <path d="M 180 34 V 10 L 199 34 V 10" class="brand-letter" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
