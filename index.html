    <script>

    <style>
      #startup-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 43%, rgba(30, 64, 175, .18), transparent 25%),
          radial-gradient(circle at 50% 50%, #0b1024 0%, #030510 48%, #010209 100%);
        transition: opacity .22s ease, visibility .22s ease;
      }
      #startup-loader.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      .startup-loader__content {
        display: grid;
        justify-items: center;
        gap: 18px;
        transform: translateY(-2vh);
      }
      .startup-loader__mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 112px;
        height: 112px;
        border-radius: 999px;
        background: rgba(3, 5, 16, .88);
        box-shadow:
          0 0 0 1px rgba(148, 163, 184, .08),
          0 0 32px rgba(56, 189, 248, .16),
          inset 0 0 22px rgba(37, 99, 235, .12);
      }
      .startup-loader__mark::before {
        content: "";
        position: absolute;
        inset: -2px;
        padding: 3px;
        border-radius: inherit;
        background: conic-gradient(
          from 0deg,
          #38bdf8 0deg 132deg,
          transparent 132deg 180deg,
          #d946ef 180deg 312deg,
          transparent 312deg 360deg
        );
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        animation: startup-spin 1.7s linear infinite;
      }
      .startup-loader__mark::after {
        content: "";
        position: absolute;
        inset: 11px;
        border-radius: inherit;
        border: 1px solid rgba(125, 211, 252, .14);
        box-shadow: inset 0 0 18px rgba(59, 130, 246, .12);
      }
      .startup-loader__core {
        position: relative;
        z-index: 1;
        width: 58px;
        height: 58px;
        border-radius: 16px;
        object-fit: contain;
        background: #ffffff;
        padding: 5px;
        box-shadow:
          0 0 0 1px rgba(226, 232, 240, .9),
          0 0 20px rgba(56, 189, 248, .55);
      }
      .startup-loader__orbit {
        position: absolute;
        inset: -10px;
        border: 2px solid transparent;
        border-top-color: #fbbf24;
        border-bottom-color: #42e8a0;
        border-radius: inherit;
        animation: startup-spin-reverse 2.4s linear infinite;
      }
      .startup-loader__label {
        color: #f8fafc;
        font: 700 11px/1 system-ui, sans-serif;
        letter-spacing: .08em;
        text-transform: uppercase;
        text-shadow: 0 0 16px rgba(125, 211, 252, .35);
      }
      @keyframes startup-spin { to { transform: rotate(360deg); } }
      @keyframes startup-spin-reverse { to { transform: rotate(-360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .startup-loader__mark::before,
        .startup-loader__orbit { animation: none; }
      }
    </style>
